[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-markov-decision-process-value-iteration-skill"
version = "1.0.0"
description = "Finite Markov Decision Process (MDP) solver using Bellman optimality value iteration and policy extraction."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-markov-decision-process-value-iteration-skill"
Repository = "https://github.com/alphaparkinc/genpark-markov-decision-process-value-iteration-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-markov-decision-process-value-iteration-skill/issues"
